<style>
  :root{
    --bg:#F5F5F7;
    --card:#FFFFFF;
    --ink:#111111;
    --ink-2:#3A3A3C;
    --ink-3:#8E8E93;
    --line:#E5E5EA;
    --line-soft:#F0F0F3;
    --pink:#FF3B6B;
    --pink-soft:#FFECF1;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --shadow:0 1px 2px rgba(17,17,17,.04), 0 8px 22px rgba(17,17,17,.05);
    --shadow-lift:0 4px 14px rgba(17,17,17,.14);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Helvetica Neue",Arial,sans-serif;
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  input,select,textarea{font:inherit;color:inherit;}
  h1,h2,h3,p,ul,li,figure{margin:0;padding:0;}
  ul{list-style:none;}
  [hidden]{display:none !important;}

  .app{
    position:relative;display:flex;flex-direction:column;
    width:100%;max-width:480px;margin:0 auto;
    height:100vh;height:100dvh;
    background:var(--bg);overflow:hidden;
  }
  @media (min-width:560px){
    body{display:flex;align-items:center;justify-content:center;padding:24px;min-height:100dvh;background:#E8E8ED;}
    .app{height:calc(100dvh - 48px);max-height:940px;border-radius:34px;box-shadow:0 30px 70px rgba(17,17,17,.16);}
  }

  /* ── 상단 ───────────────────────────────── */
  .topbar{
    flex:0 0 auto;padding:calc(var(--safe-t) + 20px) 20px 6px;
    background:var(--bg);z-index:5;
  }
  .topbar-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .brand{min-width:0;}
  .brand h1{
    font-size:clamp(21px,6.3vw,25px);font-weight:800;letter-spacing:-1.1px;line-height:1.22;
    display:flex;align-items:center;gap:7px;white-space:nowrap;
  }
  .brand h1 .emoji{font-size:.88em;letter-spacing:0;}
  .brand-sub{margin-top:6px;font-size:13.5px;font-weight:600;color:#6E6E73;letter-spacing:-.2px;}
  .topbar-actions{display:flex;align-items:center;gap:7px;flex:0 0 auto;padding-top:1px;}
  .icon-btn{
    width:38px;height:38px;border-radius:999px;display:grid;place-items:center;
    background:#fff;border:1px solid var(--line);color:#6E6E73;
  }
  .icon-btn:active{background:#EDEDF0;}
  .pill-add{
    display:inline-flex;align-items:center;gap:5px;
    height:50px;padding:0 17px;border-radius:999px;
    background:var(--ink);color:#fff;font-size:clamp(14px,4.1vw,16px);font-weight:800;letter-spacing:-.4px;
    box-shadow:0 8px 18px rgba(17,17,17,.22);white-space:nowrap;
  }
  .pill-add:active{background:#000;transform:scale(.98);}
  .pill-add .plus{font-size:17px;font-weight:800;line-height:1;}

  .searchbar{position:relative;margin-top:15px;}
  .searchbar input{
    width:100%;height:54px;border-radius:999px;border:1px solid var(--line);
    background:#fff;padding:0 46px 0 46px;font-size:16px;letter-spacing:-.3px;
    appearance:none;-webkit-appearance:none;
  }
  .searchbar input::placeholder{color:#A9A9AE;}
  .searchbar input:focus{outline:none;border-color:#CFCFD6;box-shadow:0 0 0 4px rgba(17,17,17,.05);}
  .search-icon{
    position:absolute;left:15px;top:50%;transform:translateY(-50%);
    font-size:17px;line-height:1;pointer-events:none;opacity:.85;
  }
  .search-clear{
    position:absolute;right:4px;top:50%;transform:translateY(-50%);
    width:40px;height:44px;display:none;place-items:center;color:#A9A9AE;font-size:17px;
  }
  .searchbar.has-text .search-clear{display:grid;}

  .segmented{
    position:relative;display:flex;margin-top:14px;padding:4px;
    background:#E9E9EE;border-radius:999px;
  }
  .seg-thumb{
    position:absolute;top:4px;left:4px;width:calc(50% - 4px);height:calc(100% - 8px);
    background:#fff;border-radius:999px;box-shadow:0 2px 8px rgba(17,17,17,.10);
    transition:transform .26s cubic-bezier(.3,.8,.3,1);
  }
  .segmented[data-view="stats"] .seg-thumb{transform:translateX(100%);}
  .seg-btn{
    position:relative;z-index:1;flex:1 1 0;min-width:0;height:50px;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:800;letter-spacing:-.5px;color:#8E8E93;border-radius:999px;
  }
  .seg-btn.is-active{color:var(--ink);}

  /* ── 본문 ────────────────────────────────── */
  .content{
    flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    padding:12px 20px calc(30px + var(--safe-b));
    scrollbar-width:none;
  }
  .content::-webkit-scrollbar{width:0;height:0;}
  .view{display:none;}
  .view.is-active{display:block;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}

  /* ── 필터 칩 ─────────────────────────────── */
  .chips-row{
    display:flex;gap:8px;overflow-x:auto;padding:2px 20px 12px;margin:0 -20px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .chips-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;
    height:46px;padding:0 19px;border-radius:999px;
    background:#fff;border:1px solid var(--line);
    font-size:15px;font-weight:700;color:var(--ink-2);letter-spacing:-.3px;
    transition:background .16s ease,color .16s ease,border-color .16s ease;
  }
  .chip:active{transform:scale(.97);}
  .chip.is-active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .chip .chip-emoji{font-size:14px;line-height:1;}

  .list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 11px;}
  .list-count{font-size:12.5px;color:var(--ink-3);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.1px;}
  .sort-btn{
    display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 2px;
    font-size:12.5px;font-weight:800;color:var(--ink-2);letter-spacing:-.2px;
  }
  .sort-btn .arrow{font-size:11px;color:var(--ink-3);}

  .sample-note{
    display:flex;align-items:center;gap:10px;justify-content:space-between;
    background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:8px 8px 8px 14px;margin-bottom:12px;
  }
  .sample-note p{font-size:12px;color:#6E6E73;line-height:1.45;}
  .sample-note button{
    flex:0 0 auto;min-height:36px;padding:0 12px;border-radius:10px;
    background:#F5F5F7;border:1px solid var(--line);color:var(--ink-2);font-size:12px;font-weight:800;
  }

  /* ── 3×3 표지 그리드 ─────────────────────── */
  .cover-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 10px;}
  .cell{display:flex;flex-direction:column;min-width:0;text-align:left;border-radius:14px;}
  .cell:focus-visible{outline:none;}
  .cell:focus-visible .cover-wrap{box-shadow:0 0 0 3px rgba(17,17,17,.28);}
  .cover-wrap{
    position:relative;display:block;width:100%;aspect-ratio:2 / 3;
    border-radius:12px;overflow:hidden;background:#E4E4E9;
    box-shadow:0 5px 14px rgba(17,17,17,.12);
    transition:transform .13s ease;
  }
  .cell:active .cover-wrap{transform:scale(.98);}
  .cover-wrap img{display:block;width:100%;height:100%;object-fit:cover;}
  .cover-fallback{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:14px 11px;color:#fff;text-align:center;
    font-size:13.5px;font-weight:800;line-height:1.38;letter-spacing:-.3px;
    word-break:keep-all;overflow:hidden;
  }
  .cover-fallback::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:6px;
    background:rgba(0,0,0,.16);
  }
  .cover-fallback::after{
    content:"";position:absolute;left:6px;top:0;bottom:0;width:1px;
    background:rgba(255,255,255,.22);pointer-events:none;
  }
  .cover-spine{position:absolute;inset:0;pointer-events:none;}
  .heart-btn{
    position:absolute;left:0;bottom:0;width:44px;height:44px;
    display:grid;place-items:center;z-index:2;
  }
  .heart-btn svg{width:22px;height:22px;display:block;filter:drop-shadow(0 1px 4px rgba(0,0,0,.42));}
  .heart-btn .h-fill{fill:#fff;transition:fill .16s ease, transform .16s ease;transform-origin:50% 55%;}
  .heart-btn.is-on .h-fill{fill:var(--pink);}
  .heart-btn:active .h-fill{transform:scale(.88);}
  .month-badge{
    position:absolute;right:7px;bottom:8px;z-index:2;
    font-size:12.5px;font-weight:800;letter-spacing:.1px;color:#fff;
    font-variant-numeric:tabular-nums;text-shadow:0 1px 5px rgba(0,0,0,.55);
  }
  .cell-title{
    margin-top:9px;font-size:14.5px;font-weight:800;letter-spacing:-.4px;line-height:1.32;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    word-break:keep-all;
  }
  .cell-author{
    margin-top:3px;font-size:12.5px;color:var(--ink-3);font-weight:500;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  /* ── 빈 상태 ─────────────────────────────── */
  .empty{text-align:center;padding:38px 14px 20px;}
  .empty-art{
    width:96px;height:96px;margin:0 auto 16px;border-radius:30px;display:grid;place-items:center;
    background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);font-size:40px;
  }
  .empty h2{font-size:17px;font-weight:800;letter-spacing:-.5px;}
  .empty p{font-size:13px;color:var(--ink-3);margin-top:8px;line-height:1.65;}
  .empty-actions{margin-top:20px;display:flex;flex-direction:column;gap:9px;}
  .empty-hint{font-size:11.5px;color:#A9A9AE;margin-top:18px;line-height:1.65;}
  .no-result{text-align:center;padding:40px 12px;color:var(--ink-3);font-size:13.5px;line-height:1.7;}
  .no-result button{
    margin-top:14px;min-height:44px;padding:0 18px;border-radius:999px;
    background:#fff;border:1px solid var(--line);font-size:13px;font-weight:800;color:var(--ink-2);
  }

  /* ── 통계 ───────────────────────────────── */
  .stat-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:12px;}
  .stat-card{
    background:#fff;border-radius:16px;padding:15px 8px 14px;text-align:center;
    box-shadow:var(--shadow);
  }
  .stat-label{font-size:12.5px;font-weight:700;color:#6E6E73;letter-spacing:-.3px;line-height:1.25;}
  .stat-value{
    margin-top:9px;font-size:23px;font-weight:800;letter-spacing:-1.1px;line-height:1.1;
    font-variant-numeric:tabular-nums;
  }
  .stat-value.pink{color:var(--pink);}
  .stat-value .unit{font-size:12.5px;font-weight:800;letter-spacing:0;margin-left:1px;}

  .panel{background:#fff;border-radius:18px;padding:17px 17px 10px;margin-bottom:12px;box-shadow:var(--shadow);}
  .panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .panel-title{font-size:17px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:5px;}
  .panel-title .emoji{font-size:15px;}
  .panel-note{font-size:11.5px;color:#A9A9AE;font-weight:700;}

  .bar-row{
    display:flex;align-items:center;gap:11px;width:100%;min-height:46px;
    padding:2px 0;text-align:left;border-radius:10px;
  }
  .bar-row:active{background:#FAFAFC;}
  .bar-label{
    flex:0 0 96px;font-size:12.5px;font-weight:700;color:var(--ink-2);letter-spacing:-.4px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums;
  }
  .bar-label .pct{color:var(--ink-3);font-weight:700;}
  .bar-track{flex:1 1 auto;min-width:0;height:8px;border-radius:999px;background:#F0F0F3;overflow:hidden;}
  .bar-fill{display:block;height:100%;border-radius:999px;background:var(--ink);transition:width .45s cubic-bezier(.2,.8,.2,1);}
  .bar-value{
    flex:0 0 auto;min-width:34px;text-align:right;font-size:13px;font-weight:800;
    font-variant-numeric:tabular-nums;letter-spacing:-.2px;
  }
  .panel-empty{font-size:13px;color:#A9A9AE;padding:10px 0 18px;text-align:center;line-height:1.6;}
  .panel-foot{
    display:flex;justify-content:space-between;padding:10px 0 8px;margin-top:4px;
    border-top:1px solid var(--line-soft);font-size:11.5px;color:#A9A9AE;font-weight:700;
  }

  /* ── 바텀 시트 ───────────────────────────── */
  .sheet-wrap{
    position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;
    background:rgba(20,20,22,.44);opacity:0;pointer-events:none;visibility:hidden;
    transition:opacity .22s ease, visibility .22s ease;
  }
  .sheet-wrap.open{opacity:1;pointer-events:auto;visibility:visible;}
  .sheet{
    width:100%;max-width:480px;max-height:92vh;max-height:92dvh;
    background:var(--bg);border-radius:24px 24px 0 0;
    display:flex;flex-direction:column;
    transform:translateY(18px);transition:transform .26s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 -12px 40px rgba(20,20,22,.22);
  }
  .sheet-wrap.open .sheet{transform:none;}
  .sheet-grip{width:38px;height:4px;border-radius:99px;background:#D6D6DC;margin:8px auto 0;flex:0 0 auto;}
  .sheet-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 20px 6px;}
  .sheet-title{font-size:18px;font-weight:800;letter-spacing:-.6px;}
  .sheet-close{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;color:var(--ink-3);}
  .sheet-close:active{background:#E9E9EE;}
  .sheet-body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 20px 20px;overscroll-behavior:contain;}
  .sheet-foot{
    flex:0 0 auto;display:flex;gap:8px;padding:10px 20px calc(14px + var(--safe-b));
    border-top:1px solid var(--line);background:rgba(245,245,247,.96);
  }
  @media (min-width:560px){
    .sheet-wrap{align-items:center;padding:24px;}
    .sheet{border-radius:24px;max-height:calc(100dvh - 48px);}
    .sheet-grip{display:none;}
  }
  .sheet-open .content{overflow:hidden;}

  /* ── 폼 ─────────────────────────────────── */
  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  .label{display:block;font-size:12.5px;font-weight:800;color:var(--ink-2);margin-bottom:8px;letter-spacing:-.2px;}
  .label .req{color:var(--pink);margin-left:2px;}
  .label .opt{color:#A9A9AE;font-weight:700;font-size:11px;margin-left:4px;}
  .input,.textarea{
    width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;
    padding:13px 14px;font-size:16px;color:var(--ink);appearance:none;-webkit-appearance:none;letter-spacing:-.2px;
  }
  .input{height:50px;padding:0 14px;}
  .textarea{min-height:96px;line-height:1.6;resize:vertical;}
  .input:focus,.textarea:focus{outline:none;border-color:#CFCFD6;box-shadow:0 0 0 4px rgba(17,17,17,.05);}
  .input::placeholder,.textarea::placeholder{color:#B4B4B9;}
  .input.invalid{border-color:#F0A3B5;background:#FFF7F9;}
  .field-error{font-size:11.5px;color:#D7263D;margin-top:6px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1 1 0;min-width:0;}
  .date-row{display:flex;gap:8px;align-items:center;}
  .date-row .input{flex:1 1 auto;min-width:0;}
  .mini-btn{
    flex:0 0 auto;min-height:50px;padding:0 14px;border-radius:14px;background:#fff;
    border:1px solid var(--line);font-size:13px;font-weight:800;color:var(--ink-2);
  }
  .mini-btn:active{background:#F0F0F3;}
  .counter{font-size:11px;color:#A9A9AE;text-align:right;margin-top:6px;font-variant-numeric:tabular-nums;}

  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chips .chip{height:44px;padding:0 16px;font-size:13.5px;}
  .chips .chip.is-active{background:var(--ink);border-color:var(--ink);color:#fff;}

  .fav-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 14px;
  }
  .fav-label{font-size:14px;font-weight:800;letter-spacing:-.3px;}
  .fav-desc{font-size:11.5px;color:#A9A9AE;margin-top:2px;font-weight:600;}
  .switch{
    flex:0 0 auto;width:52px;height:32px;border-radius:999px;background:#D9D9E0;position:relative;
    transition:background .18s ease;
  }
  .switch .knob{
    position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;
    box-shadow:0 1px 3px rgba(17,17,17,.25);transition:transform .2s cubic-bezier(.3,.8,.3,1);
  }
  .switch[aria-checked="true"]{background:var(--pink);}
  .switch[aria-checked="true"] .knob{transform:translateX(20px);}

  /* 별점 입력 */
  .rate-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .rate-input{position:relative;display:inline-block;padding:6px 0;}
  .rate-stars{position:relative;display:inline-block;font-size:30px;line-height:1;letter-spacing:3px;color:#E4E4E9;}
  .rate-fill{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--ink);letter-spacing:3px;}
  .rate-hits{position:absolute;inset:0;display:flex;}
  .rate-hits button{flex:1 1 0;min-width:0;height:100%;}
  .rate-value{font-size:13px;color:var(--ink-2);font-weight:800;font-variant-numeric:tabular-nums;}
  .rate-value small{font-weight:700;color:#A9A9AE;margin-left:3px;}
  .rate-clear{min-height:44px;padding:0 12px;border-radius:10px;background:#EFEFF2;font-size:11.5px;font-weight:800;color:var(--ink-3);}

  /* 표지 편집 */
  .cover-editor{display:flex;gap:14px;align-items:flex-start;}
  .cover-preview{
    flex:0 0 auto;width:68px;height:102px;border-radius:10px;overflow:hidden;position:relative;
    background:#E4E4E9;box-shadow:0 4px 12px rgba(17,17,17,.16);
  }
  .cover-preview img{display:block;width:100%;height:100%;object-fit:cover;}
  .cover-preview .cover-fallback{font-size:9px;padding:8px 5px;}
  .cover-actions{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;gap:7px;}
  .cover-actions .mini-btn{min-height:44px;padding:0 12px;font-size:12.5px;border-radius:12px;}
  .cover-url-row{margin-top:11px;}
  .cover-status{font-size:11.5px;color:#A9A9AE;margin-top:8px;line-height:1.5;}
  .cover-status.error{color:#D7263D;}
  .cover-results{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none;}
  .cover-results::-webkit-scrollbar{display:none;}
  .cover-result{
    flex:0 0 auto;width:58px;height:87px;border-radius:7px;overflow:hidden;background:#E4E4E9;
    border:2px solid transparent;
  }
  .cover-result.is-active{border-color:var(--ink);}
  .cover-result img{width:100%;height:100%;object-fit:cover;display:block;}
  .swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .swatch{width:40px;height:42px;display:grid;place-items:center;border-radius:12px;}
  .swatch span{display:block;width:27px;height:27px;border-radius:50%;box-shadow:0 2px 5px rgba(17,17,17,.2);}
  .swatch[aria-pressed="true"] span{box-shadow:0 0 0 2px #F5F5F7,0 0 0 4px var(--ink);}

  /* 상세 */
  .detail-hero{display:flex;gap:16px;padding:6px 0 18px;}
  .detail-cover{
    flex:0 0 auto;width:104px;height:156px;border-radius:12px;overflow:hidden;position:relative;
    background:#E4E4E9;box-shadow:0 8px 22px rgba(17,17,17,.18);
  }
  .detail-cover img{width:100%;height:100%;object-fit:cover;display:block;}
  .detail-cover .cover-fallback{font-size:15px;padding:12px 9px;}
  .detail-info{flex:1 1 auto;min-width:0;padding-top:2px;}
  .detail-title{font-size:20px;font-weight:800;letter-spacing:-.7px;line-height:1.32;word-break:keep-all;}
  .detail-author{font-size:13.5px;color:var(--ink-3);margin-top:6px;}
  .detail-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:12px;}
  .tag{
    display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;
    background:#F0F0F3;font-size:11.5px;font-weight:800;color:var(--ink-2);letter-spacing:-.2px;
  }
  .detail-date{font-size:12px;color:var(--ink-3);font-weight:700;font-variant-numeric:tabular-nums;}
  .detail-stars{margin-top:10px;display:flex;align-items:center;gap:9px;}
  .stars{position:relative;display:inline-block;font-size:14px;line-height:1;letter-spacing:1px;color:#E4E4E9;}
  .stars-fill{letter-spacing:1px;}
  .stars-base,.stars-fill{display:block;white-space:nowrap;letter-spacing:1px;}
  .stars-fill{position:absolute;left:0;top:0;overflow:hidden;color:var(--ink);}
  .stars-sm{font-size:12.5px;}
  .detail-rating-num{font-size:12px;color:var(--ink-3);font-weight:800;font-variant-numeric:tabular-nums;}
  .fav-pill{
    margin-top:12px;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;
    border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:800;color:var(--ink-2);
  }
  .fav-pill.is-on{border-color:#FFD0DC;background:var(--pink-soft);color:#D7263D;}
  .detail-section{border-top:1px solid var(--line-soft);padding:16px 0 2px;margin-top:4px;}
  .detail-section h3{font-size:11.5px;font-weight:800;color:var(--ink-3);letter-spacing:.2px;margin-bottom:9px;}
  .detail-note{font-size:14.5px;line-height:1.78;color:var(--ink);white-space:pre-wrap;word-break:break-word;
    padding-left:13px;border-left:3px solid #E4E4E9;}
  .detail-empty{font-size:13px;color:#A9A9AE;}

  /* 설정 */
  .set-block{background:#fff;border-radius:16px;padding:4px 15px;margin-bottom:12px;box-shadow:var(--shadow);}
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line-soft);}
  .set-row:last-child{border-bottom:0;}
  .set-label{font-size:13.5px;font-weight:800;letter-spacing:-.2px;}
  .set-desc{font-size:11.5px;color:#A9A9AE;margin-top:3px;line-height:1.5;}
  .set-value{font-size:12.5px;color:var(--ink-3);font-weight:800;font-variant-numeric:tabular-nums;}
  .set-h{font-size:12px;font-weight:800;color:var(--ink-3);letter-spacing:.2px;margin:16px 4px 8px;}
  .check-row{display:flex;align-items:center;gap:9px;min-height:44px;font-size:13px;color:var(--ink-2);font-weight:700;}
  .check-row input{width:20px;height:20px;accent-color:var(--ink);}
  .backup-box{margin-top:9px;}
  .backup-box textarea{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.5;
    min-height:92px;background:#F5F5F7;color:var(--ink-2);
  }
  .set-actions{display:flex;gap:8px;margin-top:10px;}

  /* 버튼 공통 */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    min-height:50px;padding:0 18px;border-radius:14px;
    font-size:15px;font-weight:800;letter-spacing:-.3px;width:100%;
  }
  .btn-primary{background:var(--ink);color:#fff;box-shadow:0 8px 18px rgba(17,17,17,.18);}
  .btn-primary:active{background:#000;}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn-ghost:active{background:#EFEFF2;}
  .btn-quiet{background:#EFEFF2;color:var(--ink-2);}
  .btn-danger{background:#fff;border:1px solid #F2C4CE;color:#D7263D;}
  .btn-sm{min-height:46px;font-size:13.5px;border-radius:12px;width:auto;padding:0 15px;}

  .month-list{display:flex;flex-direction:column;}
  .month-item{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    min-height:60px;padding:8px 0;border-bottom:1px solid var(--line-soft);
  }
  .month-item:last-child{border-bottom:0;}
  .month-thumb{flex:0 0 auto;width:38px;height:57px;border-radius:6px;overflow:hidden;position:relative;background:#E4E4E9;box-shadow:0 2px 6px rgba(17,17,17,.14);}
  .month-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .month-thumb .cover-fallback{font-size:8px;padding:3px;}
  .month-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .month-title{display:block;font-size:14px;font-weight:800;letter-spacing:-.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  }

  function validateBook(input) {

    var errors = {};
    var title = text(src.title, MAX_TITLE);
    if (!title) errors.title = '제목을 입력해 주세요.';
    var date = typeof src.completedAt === 'string' ? src.completedAt.trim() : '';
    if (date && !isIsoDate(date)) errors.date = '완독일을 다시 확인해 주세요.';
    var memo = (src.note === null || src.note === undefined) ? '' : String(src.note);
    var value = {
      id: typeof src.id === 'string' ? src.id : '',
      title: title,
      author: text(src.author, MAX_AUTHOR),
      completedAt: date,
      category: normalizeCategory(src.category),
      rating: clampRating(src.rating),
      favorite: src.favorite === true,
      cover: normalizeCover(src.cover),
      color: isColorId(src.color) ? src.color : DEFAULT_COLOR,
      note: text(memo, MAX_NOTE),
      createdAt: typeof src.createdAt === 'string' ? src.createdAt : '',
      updatedAt: typeof src.updatedAt === 'string' ? src.updatedAt : '',
      sample: src.sample === true

    return { ok: Object.keys(errors).length === 0, errors: errors, value: value };
  }

  /* 완독일 최신순(내림차순) 기본 비교. 완독일이 없으면 항상 뒤로. */
  function compareBooks(a, b) {
    var ad = a && a.completedAt ? a.completedAt : '';
    var bd = b && b.completedAt ? b.completedAt : '';
    if (ad !== bd) {
      if (!ad) return 1;
      if (!bd) return -1;
      return ad < bd ? 1 : -1;
    }
    return String((a && a.title) || '').localeCompare(String((b && b.title) || ''), 'ko');
  }

  function sortBooks(list, dir) {
    var asc = dir === 'asc';
    var arr = (Array.isArray(list) ? list.slice() : []);
    arr.sort(function (a, b) {
      var ad = a && a.completedAt ? a.completedAt : '';
      var bd = b && b.completedAt ? b.completedAt : '';
      if (ad !== bd) {
        if (!ad) return 1;
        if (!bd) return -1;
        return ad < bd ? (asc ? -1 : 1) : (asc ? 1 : -1);
      }
      return String((a && a.title) || '').localeCompare(String((b && b.title) || ''), 'ko');
    });
    return arr;
  }

  function tokens(query) {
    return String(query == null ? '' : query).toLowerCase().split(/\s+/).filter(function (t) { return t.length > 0; });
  }

  function matchesQuery(book, toks) {
    if (!toks.length) return true;
    var hay = [book.title || '', book.author || '', book.note || '', book.category || ''].join(' ').toLowerCase();
    for (var i = 0; i < toks.length; i++) {
      if (hay.indexOf(toks[i]) === -1) return false;
    }
    return true;
  }

  /* options: { q, filter: 'all'|'fav'|<category>, sort: 'desc'|'asc' } */
  function filterBooks(books, options) {
    var opt = options || {};
    var list = Array.isArray(books) ? books : [];
    var toks = tokens(opt.q);
    var filter = opt.filter && opt.filter !== '' ? opt.filter : 'all';
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var b = list[i];
      if (filter === 'fav') {
        if (b.favorite !== true) continue;
      } else if (filter !== 'all' && b.category !== filter) {
        continue;
      }
      if (!matchesQuery(b, toks)) continue;
      out.push(b);
    }
    return sortBooks(out, opt.sort);
  }

  /* 전체 서재 기준 통계 */
  function aggregate(books, now) {
    var list = Array.isArray(books) ? books : [];
    var base = now ? new Date(now) : new Date();
    if (isNaN(base.getTime())) base = new Date();
    var thisKey = base.getFullYear() + '-' + pad2(base.getMonth() + 1);
    var total = list.length, favoriteCount = 0, thisMonth = 0;
    var months = {}, cats = {};
    for (var i = 0; i < list.length; i++) {
      var b = list[i];
      if (b.favorite === true) favoriteCount += 1;
      var key = monthKey(b.completedAt);
      if (key) {
        if (!months[key]) months[key] = [];
        months[key].push(b);
        if (key === thisKey) thisMonth += 1;
      }
      cats[b.category] = (cats[b.category] || 0) + 1;
    }
    var byMonth = Object.keys(months).sort().reverse().map(function (k) {
      return { key: k, label: k, count: months[k].length, books: sortBooks(months[k], 'desc') };
    });
    var byCategory = CATEGORIES.filter(function (c) { return cats[c] > 0; }).map(function (c) {
      return { category: c, count: cats[c], pct: total ? Math.round((cats[c] / total) * 1000) / 10 : 0 };
    }).sort(function (a, b) {
      if (b.count !== a.count) return b.count - a.count;
      return CATEGORIES.indexOf(a.category) - CATEGORIES.indexOf(b.category);
    });
    var maxMonthCount = 0;
    byMonth.forEach(function (row) { if (row.count > maxMonthCount) maxMonthCount = row.count; });
    var maxCatCount = byCategory.length ? byCategory[0].count : 0;
    return {
      total: total,
      favoriteCount: favoriteCount,
      thisMonth: thisMonth,
      thisMonthKey: thisKey,
      byMonth: byMonth,
      byCategory: byCategory,
      maxMonthCount: maxMonthCount,
      maxCatCount: maxCatCount
    };
  }

  function countByFilter(books, filter) {
    var list = Array.isArray(books) ? books : [];
    if (filter === 'all') return list.length;
    if (filter === 'fav') return list.filter(function (b) { return b.favorite === true; }).length;
    return list.filter(function (b) { return b.category === filter; }).length;
  }

  function buildPayload(books, goals, now) {
    return {
      app: '독서 기록',
      version: SCHEMA_VERSION,
      exportedAt: isoStamp(now),
      books: (Array.isArray(books) ? books : []).map(function (b) { return normalizeBook(b); }),
      goals: (goals && typeof goals === 'object') ? goals : {}
    };
  }

  function serialize(data) {
    return JSON.stringify(data, null, 2);
  }

  function parseBackup(rawText) {
    var raw = String(rawText == null ? '' : rawText).trim();
    if (!raw) return { ok: false, error: '가져올 JSON 내용이 비어 있습니다.', books: [], goals: {}, skipped: 0 };
    var data;
    try {
      data = JSON.parse(raw);
    } catch (e) {
      return { ok: false, error: 'JSON 형식이 올바르지 않습니다.', books: [], goals: {}, skipped: 0 };
    }
    var list = null;
    var goals = {};
    if (Array.isArray(data)) {
      list = data;
    } else if (data && typeof data === 'object') {
      if (Array.isArray(data.books)) list = data.books;
      else if (Array.isArray(data.items)) list = data.items;
      else if (Array.isArray(data.data)) list = data.data;
      if (data.goals && typeof data.goals === 'object') goals = data.goals;
    }
    if (!list) {
      return { ok: false, error: '백업 데이터에서 책 목록(books)을 찾지 못했습니다.', books: [], goals: {}, skipped: 0 };
    }
    var books = [], seen = {}, skipped = 0;
    list.forEach(function (item) {
      if (!item || typeof item !== 'object' || Array.isArray(item)) { skipped += 1; return; }
      var b = normalizeBook(item);
      if (!b.title) { skipped += 1; return; }
      if (seen[b.id]) b.id = uid();
      seen[b.id] = true;
      books.push(b);
    });
    return { ok: true, error: '', books: books, goals: goals, skipped: skipped };
  }

  function sampleBooks(now) {
    var base = now ? new Date(now) : new Date();
    if (isNaN(base.getTime())) base = new Date();
    var year = base.getFullYear();
    function back(days) {
      var d = new Date(base.getTime() - days * 86400000);
      var iso = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
      return yearOf(iso) === year ? iso : (year + '-01-05');
    }
    return [
      {
        id: 'sample-1', title: '작별하지 않는다', author: '한강', completedAt: back(96),
        rating: 4.5, category: '소설', color: 'forest', favorite: true, cover: { kind: 'none', src: '' },
        note: '“우리는 이별을 견디는 방식으로 서로를 기억한다.” 오래 마음에 남는 문장이었다.',
        sample: true
      },
      {
        id: 'sample-2', title: '총, 균, 쇠', author: '재레드 다이아몬드', completedAt: back(58),
        rating: 4, category: '인문', color: 'navy', favorite: false, cover: { kind: 'none', src: '' },
        note: '문명의 격차를 환경 조건에서 다시 읽게 해 준 책. 분량은 많지만 3부부터 몰입된다.',
        sample: true
      },
      {
        id: 'sample-3', title: '하마터면 열심히 살 뻔했다', author: '하완', completedAt: back(19),
        rating: 4.5, category: '에세이', color: 'mustard', favorite: false, cover: { kind: 'none', src: '' },
        note: '웃다가 갑자기 서글퍼지는 문장들. 마음이 지칠 때 다시 펼쳐볼 것 같다.',
        sample: true
      }
    ].map(normalizeBook);
  }

  root.ReadingCore = {
    STORAGE_KEY: STORAGE_KEY,
    SCHEMA_VERSION: SCHEMA_VERSION,
    CATEGORIES: CATEGORIES,
    COLORS: COLORS,
    DEFAULT_COLOR: DEFAULT_COLOR,
    RATING_STEP: RATING_STEP,
    MAX_NOTE: MAX_NOTE,
    escapeHtml: escapeHtml,
    text: text,
    isCategory: isCategory,
    normalizeCategory: normalizeCategory,
    isColorId: isColorId,
    colorHex: colorHex,
    colorLabel: colorLabel,
    shadeHex: shadeHex,
    coverStyle: coverStyle,
    safeImageSrc: safeImageSrc,
    normalizeCover: normalizeCover,
    isIsoDate: isIsoDate,
    todayIso: todayIso,
    formatDate: formatDate,
    formatRating: formatRating,
    monthBadge: monthBadge,
    monthKey: monthKey,
    formatMonthKey: formatMonthKey,
    yearOf: yearOf,
    monthOf: monthOf,
    clampRating: clampRating,
    uid: uid,
    normalizeBook: normalizeBook,
    validateBook: validateBook,
    compareBooks: compareBooks,
    sortBooks: sortBooks,
    filterBooks: filterBooks,
    matchesQuery: matchesQuery,

<!-- ══════════ UI ══════════ -->
<script id="reading-ui">
(function () {
  'use strict';

  var C = window.ReadingCore;
  if (!C) return;

  function $(id) { return document.getElementById(id); }
  function esc(v) { return C.escapeHtml(v); }

  var STORAGE_KEY = C.STORAGE_KEY;

  var state = {
    books: [],
    goals: {},
    view: 'library',
    q: '',
    filter: 'all',
    sort: 'desc',
    editingId: null,
    detailId: null,
    monthKey: '',
    formRating: 0,
    formCategory: '소설',
    formColor: C.DEFAULT_COLOR,
    formFavorite: false,
    formCover: { kind: 'none', src: '' },
    lastSavedAt: ''
  };

  var currentSheet = null;
  var lastFocus = null;
  var toastTimer = null;

  /* ───── 저장소 ───── */

  function loadFromStorage() {
    var raw = null;
    try {
      raw = window.localStorage.getItem(STORAGE_KEY);
    } catch (e) {
      raw = null;
    }
    if (!raw) return;
    var parsed = C.parseBackup(raw);
    if (!parsed.ok) return;
    state.books = parsed.books;
    state.goals = parsed.goals || {};
    try {
      var meta = JSON.parse(raw);
      if (meta && typeof meta.exportedAt === 'string') state.lastSavedAt = meta.exportedAt;
    } catch (e) {}
  }

  function save() {
    var payload = C.buildPayload(state.books, state.goals);
    try {
      window.localStorage.setItem(STORAGE_KEY, C.serialize(payload));
      state.lastSavedAt = payload.exportedAt;
      return true;
    } catch (e) {
      toast('저장 공간이 부족해 기록을 저장하지 못했어요. 표지 사진 수를 줄여 보세요.');
      return false;
    }
  }

  /* ───── 조각 ───── */

  function heartSvg() {
    return '<svg viewBox="0 0 24 24" aria-hidden="true">' +
      '<path class="h-fill" d="M12 20.8c-.3 0-.6-.1-.8-.3C6.4 16.8 3 13.7 3 10c0-3.1 2.3-5.4 5.3-5.4 1.5 0 2.9.7 3.7 1.9.8-1.2 2.2-1.9 3.7-1.9C18.7 4.6 21 6.9 21 10c0 3.7-3.4 6.8-8.2 10.5-.2.2-.5.3-.8.3z"/>' +
      '</svg>';
  }

  function coverNodes(book) {
    var src = book.cover && book.cover.src ? C.safeImageSrc(book.cover.src) : '';
    if (src) {
      return '<img src="' + esc(src) + '" alt="" loading="lazy" referrerpolicy="no-referrer">';
    }
    return '<span class="cover-fallback" style="' + C.coverStyle(book.color) + '">' + esc(book.title || '제목 없음') + '</span>';
  }

  function starsHtml(rating, cls) {
    var r = Math.max(0, Math.min(5, Number(rating) || 0));
    var pct = (r / 5) * 100;
    return '<span class="stars' + (cls ? ' ' + cls : '') + '" role="img" aria-label="별점 ' + C.formatRating(r) + '점">' +
      '<span class="stars-base">★★★★★</span>' +
      '<span class="stars-fill" aria-hidden="true" style="width:' + pct.toFixed(1) + '%">★★★★★</span>' +
      '</span>';
  }

  function toast(message) {
    var el = $('toast');
    if (!el) return;
    el.textContent = message;
    el.classList.add('show');
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function () { el.classList.remove('show'); }, 2400);
  }

  /* ───── 화면 전환 ───── */

  function setView(view) {
    state.view = view === 'stats' ? 'stats' : 'library';
    var isLib = state.view === 'library';
    $('view-library').classList.toggle('is-active', isLib);
    $('view-stats').classList.toggle('is-active', !isLib);
    $('view-library').hidden = !isLib;
    $('view-stats').hidden = isLib;
    $('seg-library').classList.toggle('is-active', isLib);
    $('seg-stats').classList.toggle('is-active', !isLib);
    $('seg-library').setAttribute('aria-selected', isLib ? 'true' : 'false');
    $('seg-stats').setAttribute('aria-selected', isLib ? 'false' : 'true');
    $('segmented').setAttribute('data-view', state.view);
    $('view-library').scrollTop = 0;
    $('view-stats').scrollTop = 0;
    document.documentElement.classList.toggle('is-stats', !isLib);
  }

  /* ───── 시트 ───── */

  function openSheet(id) {
    if (currentSheet === id) return;
    if (currentSheet) closeSheet(true);
    var wrap = $(id);
    if (!wrap) return;
    lastFocus = document.activeElement;
    wrap.classList.add('open');
    wrap.setAttribute('aria-hidden', 'false');
    document.documentElement.classList.add('sheet-open');
    currentSheet = id;
    var target = wrap.querySelector('[data-autofocus]') || wrap.querySelector('input, button, textarea');
    if (target && target.focus) {
      window.setTimeout(function () {
        try { target.focus({ preventScroll: true }); } catch (e) { try { target.focus(); } catch (e2) {} }
      }, 80);
    }
  }

  function closeSheet(silent) {
    if (!currentSheet) return;
    var wrap = $(currentSheet);
    if (wrap) {
      wrap.classList.remove('open');
      wrap.setAttribute('aria-hidden', 'true');
    }
    document.documentElement.classList.remove('sheet-open');
    currentSheet = null;
    if (!silent && lastFocus && lastFocus.focus) {
      try { lastFocus.focus({ preventScroll: true }); } catch (e) {}
    }
  }

  /* ───── 서재 ───── */

  function renderHeader() {
    var fav = state.books.filter(function (b) { return b.favorite === true; }).length;
    $('brand-sub').textContent = '총 ' + state.books.length + '권의 서재 · 🩷 인생책 ' + fav + '권';
  }

  function renderChips() {
    var chips = [{ id: 'all', label: '전체' }, { id: 'fav', label: '🩷 하트만' }];
    C.CATEGORIES.forEach(function (c) {
      var n = state.books.filter(function (b) { return b.category === c; }).length;
      if (n > 0) chips.push({ id: c, label: c });
    });
    var valid = chips.map(function (c) { return c.id; });
    if (valid.indexOf(state.filter) === -1) state.filter = 'all';
    $('lib-chips').innerHTML = chips.map(function (c) {
      var on = c.id === state.filter;
      return '<button class="chip' + (on ? ' is-active' : '') + '" type="button" data-filter="' + esc(c.id) + '"' +
        ' aria-pressed="' + (on ? 'true' : 'false') + '">' + esc(c.label) + '</button>';
    }).join('');
  }

  function renderLibrary() {
    renderHeader();
    renderChips();

    $('searchbar').classList.toggle('has-text', state.q.length > 0);
    if ($('search-input').value !== state.q) $('search-input').value = state.q;

    var sortBtn = $('sort-toggle');
    sortBtn.setAttribute('aria-pressed', state.sort === 'asc' ? 'true' : 'false');
    sortBtn.innerHTML = (state.sort === 'asc'
      ? '완독 오래된순 <span class="arrow" aria-hidden="true">↑</span>'
      : '완독 최신순 <span class="arrow" aria-hidden="true">↓</span>');
    sortBtn.hidden = state.books.length === 0;

    var grid = $('lib-grid');
    var countEl = $('lib-count');
    var noteEl = $('sample-note-holder');
    var list = C.filterBooks(state.books, { q: state.q, filter: state.filter, sort: state.sort });

    countEl.textContent = state.books.length
      ? (state.filter === 'all' && !state.q.trim() ? '전체 ' + list.length + '권' : '조건에 맞는 ' + list.length + '권')
      : '';

    var hasSample = state.books.some(function (b) { return b.sample === true; });
    noteEl.innerHTML = hasSample
      ? '<div class="sample-note"><p>예시 데이터가 들어 있어요. 자유롭게 고치거나 지울 수 있습니다.</p>' +
        '<button type="button" data-act="clear-samples">예시 지우기</button></div>'
      : '';

    if (!state.books.length) {
      grid.innerHTML = emptyStateHtml();
      return;
    }
    if (!list.length) {
      grid.innerHTML = '<div class="no-result">조건에 맞는 책이 없어요.<br>검색어나 필터를 바꿔 보세요.' +
        '<br><button type="button" data-act="clear-filters">필터 초기화</button></div>';
      return;
    }
    grid.innerHTML = list.map(cellHtml).join('');
  }

  function emptyStateHtml() {
    return '<div class="empty" style="grid-column:1 / -1;">' +
      '<div class="empty-art" aria-hidden="true">📚</div>' +
      '<h2>아직 서재가 비어 있어요</h2>' +
      '<p>읽은 책 한 권부터 표지와 함께 담아보세요.<br>표지를 모으면 나만의 서재가 됩니다.</p>' +
      '<div class="empty-actions">' +
        '<button class="btn btn-primary" type="button" data-act="add">첫 책 등록하기</button>' +
        '<button class="btn btn-ghost" type="button" data-act="samples">예시 데이터 3권 넣어보기</button>' +
      '</div>' +
      '<p class="empty-hint">기록은 이 기기에만 저장되고,<br>설정에서 JSON으로 백업할 수 있어요.</p>' +
    '</div>';
  }

  function cellHtml(b) {
    var badge = C.monthBadge(b.completedAt);
    return '<div class="cell" role="button" tabindex="0" data-book="' + esc(b.id) + '" aria-label="' + esc(b.title) + ' 상세 보기">' +
      '<span class="cover-wrap">' +
        coverNodes(b) +
        '<button class="heart-btn' + (b.favorite ? ' is-on' : '') + '" type="button" data-heart="' + esc(b.id) + '"' +
          ' aria-pressed="' + (b.favorite ? 'true' : 'false') + '" aria-label="' + esc(b.title) + ' 인생책 ' + (b.favorite ? '해제' : '표시') + '">' +
          heartSvg() +
        '</button>' +
        (badge ? '<span class="month-badge">' + esc(badge) + '</span>' : '') +
      '</span>' +
      '<span class="cell-title">' + esc(b.title) + '</span>' +
      '<span class="cell-author">' + esc(b.author || '저자 미상') + '</span>' +
    '</div>';
  }

  function toggleFavorite(id) {
    var book = state.books.filter(function (b) { return b.id === id; })[0];
    if (!book) return;
    book.favorite = !book.favorite;
    book.updatedAt = new Date().toISOString();
    save();
    renderAll();
    toast(book.favorite ? '🩷 인생책으로 표시했어요.' : '인생책에서 뺐어요.');
  }

  /* ───── 통계 ───── */

  function renderStats() {
    var agg = C.aggregate(state.books);
    $('stat-row').innerHTML =
      statCard('총 완독', agg.total + '권') +
      statCard('이번 달 완독', agg.thisMonth + '권') +
      statCard('🩷 인생책', agg.favoriteCount + '권', true);

    var chart = $('month-chart');
    var foot = $('month-foot');
    if (!agg.byMonth.length) {
      chart.innerHTML = '<div class="panel-empty">아직 완독한 책이 없어요.<br>책을 등록하면 월별 흐름이 보입니다.</div>';
      foot.hidden = true;
    } else {
      chart.innerHTML = agg.byMonth.map(function (row) {
        var w = Math.max(4, Math.round((row.count / agg.maxMonthCount) * 100));
        return '<button class="bar-row" type="button" data-month="' + esc(row.key) + '" aria-label="' + esc(C.formatMonthKey(row.key)) + ' ' + row.count + '권 보기">' +
          '<span class="bar-label">' + esc(row.label) + '</span>' +
          '<span class="bar-track"><span class="bar-fill" style="width:' + w + '%"></span></span>' +
          '<span class="bar-value">' + row.count + '권</span>' +
        '</button>';
      }).join('');
      foot.hidden = false;
      var best = agg.byMonth[0];
      agg.byMonth.forEach(function (row) { if (row.count > best.count) best = row; });
      foot.innerHTML = '<span>가장 많은 달 ' + C.formatMonthKey(best.key) + '</span><span>합계 ' + agg.total + '권</span>';
    }
    $('month-note').textContent = agg.byMonth.length ? '막대를 누르면 책 목록' : '기록 없음';

    var cat = $('cat-chart');
    var note = $('cat-note');
    if (!agg.byCategory.length) {
      cat.innerHTML = '<div class="panel-empty">카테고리 기록이 없어요.</div>';
      note.textContent = '';
    } else {
      cat.innerHTML = agg.byCategory.map(function (row) {
        var w = Math.max(4, Math.round((row.count / agg.maxCatCount) * 100));
        var pct = Math.round(row.pct);
        return '<button class="bar-row" type="button" data-category="' + esc(row.category) + '" aria-label="' + esc(row.category) + ' ' + row.count + '권, 서재에서 보기">' +
          '<span class="bar-label">' + esc(row.category) + ' <span class="pct">(' + pct + '%)</span></span>' +
          '<span class="bar-track"><span class="bar-fill" style="width:' + w + '%"></span></span>' +
          '<span class="bar-value">' + row.count + '권</span>' +
        '</button>';
      }).join('');
      note.textContent = '누르면 서재로';
    }
  }

  function statCard(label, value, pink) {
    var m = /^(\d+(?:\.\d+)?)(권)$/.exec(value);
    var body = m ? m[1] + '<span class="unit">' + m[2] + '</span>' : esc(value);
    return '<div class="stat-card">' +
      '<div class="stat-label">' + esc(label) + '</div>' +
      '<div class="stat-value' + (pink ? ' pink' : '') + '">' + body + '</div>' +
    '</div>';
  }

  function renderAll() {
    renderLibrary();
    renderStats();
  }

  /* ───── 책 폼 ───── */

  function buildRatingHits() {
    var html = '';
    for (var i = 1; i <= 10; i++) {
      var v = i / 2;
      html += '<button type="button" data-rate="' + v + '" aria-label="' + C.formatRating(v) + '점"></button>';
    }
    $('rate-hits').innerHTML = html;
  }

  function buildCategoryChips() {
    $('f-categories').innerHTML = C.CATEGORIES.map(function (c) {
      return '<button class="chip" type="button" data-cat="' + esc(c) + '" aria-pressed="false">' + esc(c) + '</button>';
    }).join('');

  function buildSwatches() {
    $('f-colors').innerHTML = C.COLORS.map(function (c) {
      return '<button class="swatch" type="button" data-color="' + c.id + '" aria-pressed="false" aria-label="' + esc(c.label) + ' 표지">' +
        '<span style="background-image:linear-gradient(150deg,' + c.hex + ',' + C.shadeHex(c.hex, -0.22) + ')"></span>' +
      '</button>';

  function syncFormVisuals() {
    var pct = (state.formRating / 5) * 100;
    $('rate-fill').style.width = pct.toFixed(1) + '%';
    $('rate-value').innerHTML = state.formRating > 0
      ? C.formatRating(state.formRating) + '<small>/ 5</small>'
      : '별점 없음';
    Array.prototype.forEach.call($('rate-hits').children, function (b) {
      b.setAttribute('aria-pressed', Number(b.getAttribute('data-rate')) === state.formRating ? 'true' : 'false');
    });
    Array.prototype.forEach.call($('f-categories').children, function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-cat') === state.formCategory ? 'true' : 'false');
    });
    Array.prototype.forEach.call($('f-colors').children, function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-color') === state.formColor ? 'true' : 'false');
    });
    $('f-fav').setAttribute('aria-checked', state.formFavorite ? 'true' : 'false');
    $('f-fav').classList.toggle('is-on', state.formFavorite);
    $('note-counter').textContent = $('f-note').value.length + ' / ' + C.MAX_NOTE;
    renderCoverPreview();
  }

  function renderCoverPreview() {
    var preview = $('cover-preview');
    var src = state.formCover.kind !== 'none' ? C.safeImageSrc(state.formCover.src) : '';
    if (src) {
      preview.innerHTML = '<img src="' + esc(src) + '" alt="" referrerpolicy="no-referrer">';
    } else {
      preview.innerHTML = '<span class="cover-fallback" style="' + C.coverStyle(state.formColor) + '">' +
        esc($('f-title').value.trim() || '표지') + '</span>';
    }
    $('cover-url').value = state.formCover.kind === 'url' ? state.formCover.src : '';
    var status = $('cover-status');
    if (src) {
      status.className = 'cover-status';
      status.textContent = state.formCover.kind === 'image'
        ? '앨범에서 고른 사진을 표지로 저장합니다.'
        : '이미지 주소를 표지로 저장합니다.';
      $('cover-clear').hidden = false;
    } else {
      status.className = 'cover-status';
      status.textContent = '사진이나 주소가 없으면 색상 표지로 표시됩니다.';
      $('cover-clear').hidden = true;
    }
  }

  function openBookSheet(book) {
    state.editingId = book ? book.id : null;
    $('book-sheet-title').textContent = book ? '책 수정' : '책 등록';
    $('f-title').value = book ? book.title : '';
    $('f-author').value = book ? book.author : '';
    $('f-date').value = book ? (book.completedAt || '') : C.todayIso();
    $('f-note').value = book ? book.note : '';
    state.formRating = book ? book.rating : 0;
    state.formCategory = book ? book.category : '소설';
    state.formColor = book ? book.color : C.DEFAULT_COLOR;
    state.formFavorite = book ? book.favorite === true : false;
    state.formCover = book && book.cover ? { kind: book.cover.kind, src: book.cover.src } : { kind: 'none', src: '' };
    $('f-title').classList.remove('invalid');
    $('err-title').hidden = true;
    $('err-date').hidden = true;
    $('cover-results').hidden = true;
    $('cover-results').innerHTML = '';
    $('cover-url').value = '';
    syncFormVisuals();
    openSheet('sheet-book');
  }

  function submitBook() {
    var typedUrl = $('cover-url').value.trim();
    if (typedUrl && state.formCover.kind === 'none' && C.safeImageSrc(typedUrl)) {
      state.formCover = { kind: 'url', src: typedUrl };
    }
    var payload = {
      id: state.editingId || '',
      title: $('f-title').value,
      author: $('f-author').value,
      completedAt: $('f-date').value,
      category: state.formCategory,
      rating: state.formRating,
      favorite: state.formFavorite,
      cover: state.formCover,
      color: state.formColor,
      note: $('f-note').value
    };
    var result = C.validateBook(payload);
    $('err-title').hidden = true;
    $('err-date').hidden = true;
    $('f-title').classList.remove('invalid');
    if (!result.ok) {
      if (result.errors.title) {
        $('err-title').textContent = result.errors.title;
        $('err-title').hidden = false;
        $('f-title').classList.add('invalid');
        $('f-title').focus();
      }
      if (result.errors.date) {
        $('err-date').textContent = result.errors.date;
        $('err-date').hidden = false;
      }
      return;
    }
    var value = result.value;
    var now = new Date().toISOString();
    if (state.editingId) {
      var idx = state.books.map(function (b) { return b.id; }).indexOf(state.editingId);
      if (idx === -1) {
        toast('수정할 책을 찾지 못했어요.');
        closeSheet();
        renderAll();
        return;
      }
      var existing = state.books[idx];
      value.id = state.editingId;
      value.createdAt = existing.createdAt || now;
      value.updatedAt = now;
      value.sample = existing.sample === true && !descriptionChanged(existing, value);
      state.books[idx] = C.normalizeBook(value);
      if (!save()) return;
      closeSheet();
      renderAll();
      toast('수정했어요.');
    } else {
      var book = C.normalizeBook(value);
      book.id = C.uid();
      book.sample = false;
      book.createdAt = now;
      book.updatedAt = now;
      state.books.push(book);
      if (!save()) { state.books.pop(); return; }
      closeSheet();
      state.filter = 'all';
      state.q = '';
      renderAll();
      toast('「' + book.title + '」 서재에 담았어요.');
    }
  }

  function descriptionChanged(oldBook, newValue) {
    return oldBook.title !== newValue.title || oldBook.author !== newValue.author ||
      oldBook.note !== newValue.note || oldBook.completedAt !== newValue.completedAt ||
      oldBook.rating !== newValue.rating || oldBook.category !== newValue.category ||
      oldBook.color !== newValue.color || oldBook.favorite !== newValue.favorite ||
      (oldBook.cover ? oldBook.cover.src : '') !== (newValue.cover ? newValue.cover.src : '');
  }

  /* 표지 압축: 최대 너비 360px JPEG */
  function compressImage(file, done) {
    if (!file) { done(new Error('사진을 선택하지 않았어요.')); return; }
    if (file.size > 15 * 1024 * 1024) { done(new Error('사진이 너무 커요. 15MB 이하 사진을 골라 주세요.')); return; }
    var reader = new FileReader();
    reader.onerror = function () { done(new Error('사진을 불러오지 못했어요.')); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () { done(new Error('이미지 형식을 읽지 못했어요. 다른 사진을 골라 주세요.')); };
      img.onload = function () {
        try {
          var maxW = 360;
          var scale = Math.min(1, maxW / (img.width || maxW));
          var w = Math.max(1, Math.round((img.width || maxW) * scale));
          var h = Math.max(1, Math.round((img.height || maxW) * scale));
          var canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          var ctx = canvas.getContext('2d');
          if (!ctx) { done(new Error('이 기기에서는 사진을 줄일 수 없어요.')); return; }
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          var dataUrl = canvas.toDataURL('image/jpeg', 0.82);
          done(null, dataUrl, w, h);
        } catch (e) {
          done(new Error('사진을 처리하지 못했어요.'));
        }
      };
      img.src = String(reader.result || '');
    };
    reader.readAsDataURL(file);
  }

  /* 표지 검색 (Google Books → Open Library, 온라인일 때만) */
  function fetchJson(url) {
    return fetch(url, { cache: 'no-store' }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    });
  }

  function searchGoogleBooks(title) {
    var url = 'https://www.googleapis.com/books/v1/volumes?q=' + encodeURIComponent('intitle:' + title) +
      '&maxResults=8&printType=books&country=US';
    return fetchJson(url).then(function (data) {
      var out = [];
      ((data && data.items) || []).forEach(function (it) {
        var links = it && it.volumeInfo && it.volumeInfo.imageLinks;
        var src = links && (links.thumbnail || links.smallThumbnail);
        if (!src) return;
        src = String(src).replace(/^http:/, 'https:').replace(/&zoom=\d/, '&zoom=2');
        if (!C.safeImageSrc(src)) return;
        out.push({ src: src, title: (it.volumeInfo && it.volumeInfo.title) || '' });
      });
      return out;
    });
  }

  function searchOpenLibrary(title) {
    var url = 'https://openlibrary.org/search.json?title=' + encodeURIComponent(title) +
      '&limit=8&fields=title,cover_i';
    return fetchJson(url).then(function (data) {
      var out = [];
      ((data && data.docs) || []).forEach(function (d) {
        if (!d || !d.cover_i) return;
        out.push({ src: 'https://covers.openlibrary.org/b/id/' + d.cover_i + '-L.jpg', title: d.title || '' });
      });
      return out;
    });
  }

  function renderCoverResults(found) {
    var box = $('cover-results');
    box.innerHTML = found.map(function (f) {
      var on = state.formCover.kind === 'url' && state.formCover.src === f.src;
      return '<button class="cover-result' + (on ? ' is-active' : '') + '" type="button" data-cover-url="' + esc(f.src) + '" aria-label="' + esc(f.title || '표지') + ' 선택">' +
        '<img src="' + esc(f.src) + '" alt="" loading="lazy" referrerpolicy="no-referrer">' +
      '</button>';
    }).join('');
    box.hidden = false;
  }

  function searchCovers() {
    var title = $('f-title').value.trim();
    var box = $('cover-results');
    var status = $('cover-status');
    if (!title) {
      status.className = 'cover-status error';
      status.textContent = '먼저 책 제목을 입력해 주세요.';
      $('f-title').focus();
      return;
    }
    if (!navigator.onLine) {
      status.className = 'cover-status error';
      status.textContent = '오프라인이라 표지를 검색할 수 없어요. 앨범 사진이나 이미지 주소를 사용해 주세요.';
      return;
    }
    status.className = 'cover-status';
    status.textContent = '표지를 찾는 중...';
    box.hidden = false;
    box.innerHTML = '';
    searchGoogleBooks(title)
      .catch(function () { return []; })
      .then(function (list) {
        if (list.length) return list;
        return searchOpenLibrary(title).catch(function () { return []; });
      })
      .then(function (list) {
        if (currentSheet !== 'sheet-book') return;
        if (!list.length) {
          status.className = 'cover-status error';
          status.textContent = '표지를 찾지 못했어요. 이미지 주소를 붙여넣거나 앨범에서 골라 주세요.';
          box.hidden = true;
          return;
        }
        status.className = 'cover-status';
        status.textContent = '마음에 드는 표지를 눌러 주세요.';
        renderCoverResults(list);
      })
      .catch(function () {
        if (currentSheet !== 'sheet-book') return;
        status.className = 'cover-status error';
        status.textContent = '표지 검색에 연결하지 못했어요. 온라인 상태를 확인하거나 이미지 주소·앨범 사진을 사용해 주세요.';
        box.hidden = true;
      });
  }

  /* ───── 상세 ───── */

  function openDetail(id) {
    var book = state.books.filter(function (b) { return b.id === id; })[0];
    if (!book) return;
    state.detailId = id;
    var rows = '';
    rows += '<div class="detail-hero">' +
      '<div class="detail-cover">' + coverNodes(book) + '</div>' +
      '<div class="detail-info">' +
        '<h2 class="detail-title" id="detail-title">' + esc(book.title) + '</h2>' +
        '<div class="detail-author">' + esc(book.author || '저자 미상') + '</div>' +
        '<div class="detail-meta">' +
          '<span class="tag">' + esc(book.category) + '</span>' +
          '<span class="detail-date">' + esc(C.formatDate(book.completedAt)) + '</span>' +
        '</div>' +
        '<div class="detail-stars">' +
          (book.rating > 0
            ? starsHtml(book.rating) + '<span class="detail-rating-num">' + C.formatRating(book.rating) + ' / 5</span>'
            : '<span class="detail-rating-num">별점 없음</span>') +
        '</div>' +
        '<button class="fav-pill' + (book.favorite ? ' is-on' : '') + '" type="button" data-heart="' + esc(book.id) + '"' +
          ' aria-pressed="' + (book.favorite ? 'true' : 'false') + '">' +
          (book.favorite ? '🩷 인생책' : '🤍 인생책') +
        '</button>' +
      '</div>' +
    '</div>';
    rows += '<div class="detail-section"><h3>한 줄 평 · 메모</h3>' +
      (book.note ? '<div class="detail-note">' + esc(book.note) + '</div>'
                 : '<div class="detail-empty">아직 남긴 문장이 없어요. 수정에서 추가해 보세요.</div>') +
      '</div>';
    $('detail-body').innerHTML = rows;
    openSheet('sheet-detail');
  }

  function deleteCurrent() {
    var book = state.books.filter(function (b) { return b.id === state.detailId; })[0];
    if (!book) return;
    if (!window.confirm('「' + book.title + '」 기록을 삭제할까요?\n삭제한 기록은 되돌릴 수 없습니다.')) return;
    state.books = state.books.filter(function (b) { return b.id !== book.id; });
    save();
    closeSheet();
    renderAll();
    toast('삭제했어요.');
  }

  /* ───── 월별 목록 ───── */

  function openMonth(key) {
    state.monthKey = key;
    var row = C.aggregate(state.books).byMonth.filter(function (r) { return r.key === key; })[0];
    if (!row) return;
    $('month-sheet-title').textContent = C.formatMonthKey(key) + ' · ' + row.count + '권';
    $('month-body').innerHTML = '<div class="month-list">' + row.books.map(function (b) {
      return '<button class="month-item" type="button" data-book="' + esc(b.id) + '">' +
        '<span class="month-thumb">' + coverNodes(b) + '</span>' +
        '<span class="month-main">' +
          '<span class="month-title">' + esc(b.title) + '</span>' +
          '<span class="month-sub">' + esc(b.author || '저자 미상') + ' · ' + esc(C.formatDate(b.completedAt)) + '</span>' +
        '</span>' +
        (b.favorite ? '<span class="month-fav" aria-label="인생책">🩷</span>' : '') +
      '</button>';
    }).join('') + '</div>';
    openSheet('sheet-month');
  }

  /* ───── 설정 / 백업 ───── */

  function renderSettings() {
    $('settings-count').textContent = state.books.length + '권';
    var when = state.lastSavedAt ? new Date(state.lastSavedAt) : null;
    if (when && !isNaN(when.getTime())) {
      $('settings-desc').textContent = '자동 저장 중 · 마지막 저장 ' +
        when.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    } else {
      $('settings-desc').textContent = '이 기기의 브라우저에 자동 저장됩니다';
    }
  }

  function exportJson() {
    var payload = C.buildPayload(state.books, state.goals);
    var json = C.serialize(payload);
    $('backup-text').value = json;
    var filename = '나의서재-백업-' + C.todayIso() + '.json';
    var done = false;
    try {
      var blob = new Blob([json], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
      done = true;
    } catch (e) {
      done = false;
    }
    toast(done ? '백업 파일을 저장했어요. 아래 JSON도 복사할 수 있어요.' : '아래 JSON을 복사해 보관해 주세요.');
  }

  function copyBackup() {
    var text = $('backup-text').value;
    if (!text) {
      exportJson();
      text = $('backup-text').value;
    }
    function fallback() {
      var ta = $('backup-text');
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
        toast('JSON을 복사했어요.');
      } catch (e) {
        toast('복사가 막혀 있어요. 직접 선택해 주세요.');
      }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        toast('JSON을 복사했어요.');
      }).catch(fallback);
    } else {
      fallback();
    }
  }

  function runImport(text) {
    var raw = text == null ? $('backup-text').value : text;
    if (!String(raw || '').trim()) {
      toast('가져올 JSON이 없어요. 파일을 선택하거나 붙여넣어 주세요.');
      return;
    }
    var parsed = C.parseBackup(raw);
    if (!parsed.ok) {
      toast(parsed.error);
      return;
    }
    if (!parsed.books.length) {
      toast('가져올 책 기록이 없어요.');
      return;
    }
    var merge = $('import-merge').checked;
    if (merge) {
      var ids = {};
      state.books.forEach(function (b) { ids[b.id] = true; });
      parsed.books.forEach(function (b) {
        if (ids[b.id]) b.id = C.uid();
        ids[b.id] = true;
        state.books.push(b);
      });
      save();
      renderAll();
      renderSettings();
      closeSheet();
      toast(parsed.books.length + '권을 추가했어요.' + (parsed.skipped ? ' (' + parsed.skipped + '건 제외)' : ''));
      return;
    }
    var message = '현재 ' + state.books.length + '권의 기록을 백업 파일의 ' + parsed.books.length + '권으로 바꿉니다.\n계속할까요?';
    if (state.books.length === 0) message = '백업 파일에서 ' + parsed.books.length + '권을 가져옵니다.\n계속할까요?';
    if (!window.confirm(message)) return;
    state.books = parsed.books;
    state.goals = parsed.goals || {};
    save();
    renderAll();
    renderSettings();
    closeSheet();
    toast(parsed.books.length + '권을 가져왔어요.' + (parsed.skipped ? ' (' + parsed.skipped + '건 제외)' : ''));
  }

  function resetAll() {
    if (!state.books.length) {
      toast('이미 비어 있어요.');
      return;
    }
    if (!window.confirm('모든 독서 기록(' + state.books.length + '권)을 삭제합니다.\n이 작업은 되돌릴 수 없습니다. 계속할까요?')) return;
    state.books = [];
    state.goals = {};
    try { window.localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    state.lastSavedAt = '';
    state.filter = 'all';
    state.q = '';
    closeSheet();
    renderAll();
    toast('모든 기록을 삭제했어요.');
  }

  /* ───── 예시 ───── */

  function addSamples() {
    var samples = C.sampleBooks();
    var existing = {};
    state.books.forEach(function (b) { existing[b.id] = true; });
    samples.forEach(function (b) {
      if (existing[b.id]) b.id = C.uid();
      state.books.push(b);
    });
    save();
    renderAll();
    toast('예시 3권을 넣었어요. 자유롭게 고치거나 지워 보세요.');
  }

  function clearSamplesNow() {
    var samples = state.books.filter(function (b) { return b.sample === true; });
    if (!samples.length) return;
    state.books = state.books.filter(function (b) { return b.sample !== true; });
    save();
    renderAll();
    toast(samples.length + '권의 예시 기록을 지웠어요.');
  }

  /* ───── 이벤트 ───── */

  function bind() {
    /* 탭 전환 */
    Array.prototype.forEach.call(document.querySelectorAll('.seg-btn'), function (btn) {
      btn.addEventListener('click', function () {
        setView(btn.getAttribute('data-view'));
        if (state.view === 'stats') renderStats();
      });
    });

    /* 시트 닫기 */
    Array.prototype.forEach.call(document.querySelectorAll('[data-close]'), function (btn) {
      btn.addEventListener('click', function () { closeSheet(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.sheet-wrap'), function (wrap) {
      wrap.addEventListener('click', function (e) {
        if (e.target === wrap) closeSheet();
      });
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && currentSheet) closeSheet();
    });

    /* 검색 */
    var search = $('search-input');
    search.addEventListener('input', function () {
      state.q = search.value;
      renderLibrary();
    });
    $('search-clear').addEventListener('click', function () {
      state.q = '';
      search.value = '';
      search.focus();
      renderLibrary();
    });

    /* 정렬 */
    $('sort-toggle').addEventListener('click', function () {
      state.sort = state.sort === 'desc' ? 'asc' : 'desc';
      renderLibrary();
      toast(state.sort === 'desc' ? '완독일 최신순으로 정렬했어요.' : '완독일 오래된순으로 정렬했어요.');
    });

    /* 서재 클릭 위임 */
    $('view-library').addEventListener('click', function (e) {
      var add = e.target.closest('[data-act="add"]');
      if (add) { openBookSheet(null); return; }
      var samples = e.target.closest('[data-act="samples"]');
      if (samples) { addSamples(); return; }
      var clearSamples = e.target.closest('[data-act="clear-samples"]');
      if (clearSamples) { clearSamplesNow(); return; }
      var clearFilters = e.target.closest('[data-act="clear-filters"]');
      if (clearFilters) {
        state.q = '';
        state.filter = 'all';
        $('search-input').value = '';
        renderLibrary();
        return;
      }
      var heart = e.target.closest('[data-heart]');
      if (heart) { e.stopPropagation(); toggleFavorite(heart.getAttribute('data-heart')); return; }
      var chip = e.target.closest('[data-filter]');
      if (chip) {
        state.filter = chip.getAttribute('data-filter');
        renderLibrary();
        return;
      }
      var cell = e.target.closest('[data-book]');
      if (cell) { openDetail(cell.getAttribute('data-book')); return; }
    });

    /* 그리드 키보드 */
    $('lib-grid').addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var cell = e.target.closest && e.target.closest('[data-book]');
      if (!cell) return;
      e.preventDefault();
      openDetail(cell.getAttribute('data-book'));
    });

    /* 헤더 등록 버튼 */
    $('open-settings').addEventListener('click', function () {
      renderSettings();
      openSheet('sheet-settings');
    });
    Array.prototype.forEach.call(document.querySelectorAll('.pill-add'), function (btn) {
      btn.addEventListener('click', function () { openBookSheet(null); });
    });

    /* 통계 클릭 위임 */
    $('view-stats').addEventListener('click', function (e) {
      var month = e.target.closest('[data-month]');
      if (month) { openMonth(month.getAttribute('data-month')); return; }
      var cat = e.target.closest('[data-category]');
      if (cat) {
        state.filter = cat.getAttribute('data-category');
        state.q = '';
        $('search-input').value = '';
        renderLibrary();
        setView('library');
        toast(cat.getAttribute('data-category') + ' 책만 보고 있어요.');
        return;
      }
    });

    /* 월별 시트 */
    $('month-body').addEventListener('click', function (e) {
      var item = e.target.closest('[data-book]');
      if (!item) return;
      var id = item.getAttribute('data-book');
      closeSheet(true);
      window.setTimeout(function () { openDetail(id); }, 40);
    });
    $('month-to-lib').addEventListener('click', function () {
      closeSheet();
      setView('library');
      renderLibrary();
    });

    /* 상세 */
    $('detail-body').addEventListener('click', function (e) {
      var heart = e.target.closest('[data-heart]');
      if (!heart) return;
      toggleFavorite(heart.getAttribute('data-heart'));
      openDetail(heart.getAttribute('data-heart'));
    });
    $('detail-edit').addEventListener('click', function () {
      var book = state.books.filter(function (b) { return b.id === state.detailId; })[0];
      if (!book) return;
      closeSheet(true);
      window.setTimeout(function () { openBookSheet(book); }, 40);
    });
    $('detail-delete').addEventListener('click', deleteCurrent);

    /* 폼 */
    $('book-form').addEventListener('submit', function (e) {
      e.preventDefault();
      submitBook();
    });
    $('f-today').addEventListener('click', function () {
      $('f-date').value = C.todayIso();
    });
    $('f-note').addEventListener('input', function () {
      $('note-counter').textContent = $('f-note').value.length + ' / ' + C.MAX_NOTE;
    });
    $('f-title').addEventListener('input', function () {
      if (state.formCover.kind === 'none') renderCoverPreview();
    });
    $('rate-hits').addEventListener('click', function (e) {
      var b = e.target.closest('[data-rate]');
      if (!b) return;
      var v = Number(b.getAttribute('data-rate'));
      state.formRating = state.formRating === v ? 0 : v;
      syncFormVisuals();
    });
    $('rate-clear').addEventListener('click', function () {
      state.formRating = 0;
      syncFormVisuals();
    });
    $('f-categories').addEventListener('click', function (e) {
      var b = e.target.closest('[data-cat]');
      if (!b) return;
      state.formCategory = b.getAttribute('data-cat');
      syncFormVisuals();
    });
    $('f-colors').addEventListener('click', function (e) {
      var b = e.target.closest('[data-color]');
      if (!b) return;
      state.formColor = b.getAttribute('data-color');
      state.formCover = { kind: 'none', src: '' };
      $('cover-results').hidden = true;
      syncFormVisuals();
    });
    $('f-fav').addEventListener('click', function () {
      state.formFavorite = !state.formFavorite;
      syncFormVisuals();
    });

    /* 표지 */
    $('cover-pick').addEventListener('click', function () { $('cover-file').click(); });
    $('cover-file').addEventListener('change', function (e) {
      var file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!file) return;
      var status = $('cover-status');
      status.className = 'cover-status';
      status.textContent = '사진을 줄이는 중...';
      compressImage(file, function (err, dataUrl, w, h) {
        if (err) {
          status.className = 'cover-status error';
          status.textContent = err.message;
          return;
        }
        state.formCover = { kind: 'image', src: dataUrl };
        syncFormVisuals();
        status.className = 'cover-status';
        status.textContent = '표지 사진을 ' + w + '×' + h + ' 크기로 담았어요.';
        $('cover-results').hidden = true;
      });
    });
    $('cover-find').addEventListener('click', searchCovers);
    $('cover-results').addEventListener('click', function (e) {
      var b = e.target.closest('[data-cover-url]');
      if (!b) return;
      state.formCover = { kind: 'url', src: b.getAttribute('data-cover-url') };
      syncFormVisuals();
      Array.prototype.forEach.call($('cover-results').children, function (c) {
        c.classList.toggle('is-active', c === b);
      });
      toast('표지를 골랐어요.');
    });
    $('cover-clear').addEventListener('click', function () {
      state.formCover = { kind: 'none', src: '' };
      $('cover-results').hidden = true;
      syncFormVisuals();
    });
    $('cover-url').addEventListener('change', function () {
      var v = $('cover-url').value.trim();
      var status = $('cover-status');
      if (!v) {
        state.formCover = { kind: 'none', src: '' };
        syncFormVisuals();
        return;
      }
      if (!C.safeImageSrc(v)) {
        status.className = 'cover-status error';
        status.textContent = '이미지 주소는 https:// 로 시작해야 해요.';
        return;
      }
      state.formCover = { kind: 'url', src: v };
      syncFormVisuals();
    });

    /* 설정 */
    $('export-file').addEventListener('click', exportJson);
    $('export-copy').addEventListener('click', copyBackup);
    $('import-pick').addEventListener('click', function () { $('import-file').click(); });
    $('import-file').addEventListener('change', function (e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        $('backup-text').value = String(reader.result || '');
        toast('파일을 읽었어요. ‘가져오기’를 눌러 주세요.');
      };
      reader.onerror = function () { toast('파일을 읽지 못했어요.'); };
      reader.readAsText(file);
      e.target.value = '';
    });
    $('import-run').addEventListener('click', function () { runImport(); });
    $('reset-all').addEventListener('click', resetAll);
  }

  /* ───── 시작 ───── */

  function init() {
    loadFromStorage();
    buildRatingHits();
    buildCategoryChips();
    buildSwatches();
    bind();
    setView('library');
    renderAll();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
